global:
  scrape_interval: 15s
  evaluation_interval: 30s

rule_files:
  - /etc/prometheus/alerts.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["prometheus:9090"]

  - job_name: node-exporter
    static_configs:
      - targets: ["node-exporter:9100"]

  - job_name: cadvisor
    static_configs:
      - targets: ["cadvisor:8080"]

  - job_name: blackbox
    metrics_path: /probe
    params:
      module: [http_2xx]
    static_configs:
      - targets:
          # Backend SIMPEG pada jaringan simpeg-broker (docker-compose.yml root, service: backend).
          - http://backend:8080/health
          - http://backend:8080/ready
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox-exporter:9115

  # Aggregate RabbitMQ node/runtime metrics.
  - job_name: rabbitmq
    static_configs:
      - targets: ["rabbitmq:15692"]

  # Narrow per-queue scrape: only SIMPEG jobs and dead-letter queues.
  # Detailed endpoint is preferable to enabling all per-object metrics globally.
  - job_name: rabbitmq-queues
    metrics_path: /metrics/detailed
    params:
      # queue_metrics is more expensive, but the queue regex below limits
      # it to only two SIMPEG queues and provides the head message timestamp.
      family: [queue_coarse_metrics, queue_metrics]
      queue: ["^simpeg\\.jobs(\\.dead)?$"]
    static_configs:
      - targets: ["rabbitmq:15692"]

  # Optional TCP checks for SMTP submission, Supabase Postgres and Upstash Redis TLS.
  # Add real host:port targets to targets/external-tcp.yml; do not put credentials there.
  - job_name: blackbox-external
    metrics_path: /probe
    params:
      module: [tcp_connect]
    file_sd_configs:
      - files:
          - /etc/prometheus/targets/*.yml
        refresh_interval: 30s
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox-exporter:9115

  # /api/v1/admin/ops/status and /api/v1/admin/slo/metrics still require RBAC.
  # Their outbox/SLO aggregates are not scraped by Prometheus yet. Do not place
  # admin bearer tokens in prometheus.yml; add a dedicated internal exporter
  # with a short-lived/service identity before wiring those application metrics.
