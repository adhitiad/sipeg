name: Backend CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v6
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - name: Download and verify dependencies
        run: |
          go mod download
          go mod verify
      - name: Check formatting
        run: |
          files="$(gofmt -l .)"
          if [ -n "$files" ]; then
            echo "$files"
            while IFS= read -r file; do
              if [ -n "$file" ]; then
                gofmt -d "$file" || true
              fi
            done <<< "$files"
            exit 1
          fi
      - name: Run vet
        run: go vet ./...
      - name: Run staticcheck
        run: |
          go run honnef.co/go/tools/cmd/staticcheck@v0.8.2 ./...
      - name: Run tests
        run: go test -race ./...
      - name: Build
        run: go build ./...
      - name: Check for known vulnerabilities
        run: |
          go run golang.org/x/vuln/cmd/govulncheck@latest ./...
      - name: Check that no secret is committed
        run: |
          matches="$(grep -rInE '(postgres|postgresql)://[^[:space:]]+:[^@[:space:]]+@' \\
            --include='*.go' --include='*.yaml' --include='*.yml' --include='*.md' \\
            --exclude-dir=.git .. | grep -v '\.env\.example' | grep -vE '://<[^>]+>:[^>]+>@' || true)"
          if [ -n "$matches" ]; then
            echo "$matches"
            echo "A database connection string with a password was found in the repository."
            exit 1
          fi

  backend-postgres-integration:
    name: Backend Integration (PostgreSQL)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: simpeg_integration
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d simpeg_integration"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v6
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - name: Download and verify dependencies
        working-directory: backend
        run: |
          go mod download
          go mod verify
      - name: Run mandatory PostgreSQL integration tests
        working-directory: backend
        env:
          SIMPEG_TEST_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/simpeg_integration?sslmode=disable
        run: |
          set -o pipefail
          go test -tags=integration -count=1 -v ./tests/integration 2>&1 | tee ../postgres-integration.log
          if ! grep -q "INTEGRATION_STATUS=PASS" ../postgres-integration.log; then
            echo "::error::PostgreSQL integration suite did not report explicit PASS."
            exit 1
          fi
      - name: Upload PostgreSQL integration log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: postgres-integration-log
          path: postgres-integration.log
          if-no-files-found: ignore
          retention-days: 7
