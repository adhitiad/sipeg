# Alertmanager — konfigurasi penerima wajib diisi & diuji tembak (DEC-065). Biaya $0 (self-hosted).
global:
  resolve_timeout: 5m

route:
  receiver: default
  group_by: ["alertname", "job", "severity"]
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 3h
  routes:
    - matchers:
        - severity="critical"
      receiver: critical
      repeat_interval: 1h

receivers:
  # GANTI penerima di bawah dengan saluran nyata milik adhitiad/admin, lalu uji tembak.
  # Opsi $0: webhook ke layanan internal/self-hosted, email via SMTP internal, atau endpoint lokal.
  - name: default
    webhook_configs:
      - url: "http://host.docker.internal:9999/alerts"
        send_resolved: true
  - name: critical
    webhook_configs:
      - url: "http://host.docker.internal:9999/alerts-critical"
        send_resolved: true
    # Contoh email (opsional, jika SMTP tersedia):
    # email_configs:
    #   - to: "admin@example.test"
    #     from: "alertmanager@example.test"
    #     smarthost: "smtp.example.test:587"
    #     auth_username: "..."
    #     auth_password: "..."

inhibit_rules:
  - source_matchers:
      - severity="critical"
    target_matchers:
      - severity="warning"
    equal: ["alertname", "job", "instance"]
