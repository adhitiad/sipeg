# Stack broker RabbitMQ untuk SIMPEG — berdiri sendiri agar pengembangan
# dan deployment backend tidak terikat siklus hidup broker.
#
# Mode pengembangan (broker saja, backend dijalankan native):
#   docker compose up -d
#   # lalu di backend/:
#   RABBITMQ_URL="amqp://$RABBITMQ_USER:$RABBITMQ_PASSWORD@localhost:5672/" go run ./cmd/server
#   RABBITMQ_URL="amqp://$RABBITMQ_USER:$RABBITMQ_PASSWORD@localhost:5672/" go run ./cmd/jobsched
#
# Deployment satu server: jalankan stack ini lebih dahulu karena ia membuat
# jaringan simpeg-broker yang dipakai stack backend (root) sebagai
# jaringan eksternal; di matikan paling akhir.
#   # Jalankan dari root repo setelah mengisi .env (RABBITMQ_USER/PASSWORD):
#   docker compose -f rabbitmq/docker-compose.yml up -d
#   docker compose -f docker-compose.yml up -d --build
#
# Berlaku juga untuk podman-compose. Kredensial ganti melalui
# RABBITMQ_USER/RABBITMQ_PASSWORD sebelum dipakai di luar komputer lokal.

name: simpeg-broker

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "20m"
    max-file: "5"

services:
  rabbitmq:
    image: rabbitmq:4-management
    restart: unless-stopped
    logging: *default-logging
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:?Set RABBITMQ_USER in repository .env}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:?Set RABBITMQ_PASSWORD in repository .env}
    volumes:
      - ./rabbitmq.conf:/etc/rabbitmq/conf.d/10-simpeg.conf:ro
      - ./enabled_plugins:/etc/rabbitmq/enabled_plugins:ro
      - rabbitmq-data:/var/lib/rabbitmq
    ports:
      - "127.0.0.1:${RABBITMQ_AMQP_HOST_PORT:-5672}:5672" # AMQP untuk pengembangan native; broker-to-backend tetap lewat jaringan internal
      - "127.0.0.1:${RABBITMQ_MANAGEMENT_HOST_PORT:-15672}:15672" # UI manajemen loopback saja
    networks:
      - broker
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s

networks:
  broker:
    # Nama eksplisit supaya stack backend (root) dapat bergabung lewat
    # deklarasi external network dengan nama yang sama.
    name: simpeg-broker

volumes:
  rabbitmq-data:
