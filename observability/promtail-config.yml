server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  - job_name: docker
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 5s
    relabel_configs:
      - source_labels: ["__meta_docker_container_name"]
        regex: "/(.*)"
        target_label: container
      - source_labels:
          ["__meta_docker_container_label_com_docker_compose_service"]
        target_label: service
      - source_labels:
          ["__meta_docker_container_label_com_docker_compose_project"]
        target_label: compose_project
    pipeline_stages:
      - docker: {}
      # Log aplikasi backend/frontend adalah JSON satu baris; parse untuk label/field terpilih.
      - json:
          expressions:
            level: level
            msg: msg
            request_id: request_id
            path: path
            status: status
      - labels:
          level:
          msg:
      # Jangan menaikkan field sensitif menjadi label; request_id bisa dipakai sebagai field terindeks sesuai kebutuhan.
