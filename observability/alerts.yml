groups:
  - name: simpeg-infra
    rules:
      - alert: InstanceDown
        expr: up == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "Target scrape tidak tersedia"
          description: "{{ $labels.job }} / {{ $labels.instance }} tidak dapat di-scrape selama 2 menit."

      - alert: BackendProbeFailed
        expr: probe_success{job="blackbox", instance=~".*/(health|ready)"} == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "Probe backend gagal"
          description: "Endpoint {{ $labels.instance }} gagal diprobe selama 2 menit (cek /health, /ready, dan dependency)."

      - alert: HighContainerMemory
        expr: container_spec_memory_limit_bytes > 0 and (container_memory_working_set_bytes / container_spec_memory_limit_bytes) > 0.85
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Penggunaan memori container tinggi"
          description: "Container {{ $labels.name }} memakai >85% batas memori selama 5 menit."

      - alert: HighHostCPU
        expr: 100 - (avg by (instance) (rate(node_cpu_seconds_total{mode="idle"}[5m])) * 100) > 85
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "CPU host tinggi"
          description: "Penggunaan CPU >85% selama 5 menit pada {{ $labels.instance }}."

      - alert: RabbitMQTargetDown
        expr: up{job="rabbitmq"} == 0
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "Metrik RabbitMQ tidak tersedia"
          description: "Scrape RabbitMQ gagal; verifikasi plugin rabbitmq_prometheus (port 15692) dan jaringan simpeg-broker."

      - alert: RabbitMQQueueBacklog
        expr: rabbitmq_detailed_queue_messages_ready{queue="simpeg.jobs"} > 100
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Backlog antrean pekerjaan SIMPEG meningkat"
          description: "Antrean simpeg.jobs memiliki lebih dari 100 pesan siap selama 5 menit."

      - alert: RabbitMQDeadLetterNotEmpty
        expr: rabbitmq_detailed_queue_messages_ready{queue="simpeg.jobs.dead"} > 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Dead-letter RabbitMQ berisi pesan"
          description: "Periksa antrean simpeg.jobs.dead; pesan gagal tidak boleh dibiarkan tanpa triase."

      - alert: RabbitMQQueueMetricsTargetDown
        expr: up{job="rabbitmq-queues"} == 0
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "Scrape metrik antrean RabbitMQ gagal"
          description: "Endpoint detailed queue metrics tidak tersedia; periksa plugin, filter, dan jaringan."

      - alert: RabbitMQOldestJobMessageTooOld
        expr: (time() - rabbitmq_detailed_queue_head_message_timestamp{queue="simpeg.jobs"}) > 300
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Pesan pekerjaan tertua menunggu terlalu lama"
          description: "Timestamp kepala antrean menunjukkan umur lebih dari 5 menit; cek consumer, unacked, dan error job."

      - alert: RabbitMQJobsConsumerMissing
        expr: (rabbitmq_detailed_queue_messages_ready{queue="simpeg.jobs"} > 0) and (rabbitmq_detailed_queue_consumers{queue="simpeg.jobs"} == 0)
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "Antrean SIMPEG memiliki backlog tanpa consumer"
          description: "Ada pesan di simpeg.jobs tetapi tidak ada consumer aktif; periksa service backend."

      - alert: HostDiskSpaceLow
        expr: (node_filesystem_avail_bytes{fstype!~"tmpfs|overlay|squashfs"} / node_filesystem_size_bytes{fstype!~"tmpfs|overlay|squashfs"}) < 0.15
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Ruang filesystem host hampir habis"
          description: "Filesystem {{ $labels.mountpoint }} pada {{ $labels.instance }} tersisa kurang dari 15%."

      - alert: ExternalDependencyDown
        expr: probe_success{job="blackbox-external"} == 0 or up{job="blackbox-external"} == 0
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "Dependency eksternal tidak dapat diprobe"
          description: "Target {{ $labels.dependency }} / {{ $labels.instance }} gagal dihubungi melalui TCP."

  # Belum diekspor ke Prometheus: outbox FAILED/PENDING/usia tertua dan agregat SLO aplikasi.
  # Endpoint admin masih memakai RBAC; jangan menanam bearer token admin di konfigurasi scrape.
  # Tambahkan exporter internal dengan identitas khusus sebelum membuat alert outbox/SLO di sini.
  # External TCP targets hanya membuktikan konektivitas, bukan autentikasi SMTP/Redis atau query DB.
  # Lihat docs/RUNBOOK.md §9.
