name: Usulan Fitur
description: Usulkan fitur atau perbaikan untuk SIMPEG
title: "[Fitur]: "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Masalah yang ingin diselesaikan
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Usulan solusi
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: Dampak / cakupan
      description: Modul, peran, dan data yang terpengaruh.
  - type: checkboxes
    id: checklist
    attributes:
      label: Checklist
      options:
        - label: Usulan ini konsisten dengan PRD dan matriks akses (docs/PRD.md §11).
          required: false