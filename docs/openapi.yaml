openapi: 3.1.0
info:
  title: SIMPEG API
  version: 0.1.0
  description: >-
    Draft kontrak API MVP SIMPEG. Grant role statis dikonfigurasi di backend sesuai docs/PRD.md §11; permission yang
    tidak diberi grant ditolak. Versi API memakai prefix path /api/v1; perubahan yang merusak kompatibilitas menaikkan
    versi path. Respons memuat header X-API-Version. Path /api tanpa versi ditolak dengan 400 unversioned_path; versi
    yang tidak dikenal menghasilkan 404. Cakupan unit sudah ditegakkan pada endpoint pegawai, unit organisasi, jejak
    audit, slip gaji, jadwal gajian, dan kalender hari libur. Pembuatan profil tidak membuat sesi atau menetapkan role.
    Penghapusan memakai arsip/nonaktif, bukan penghapusan permanen.
servers:
  - url: /
    description: Relative to the API host
tags:
  - name: System
    description: Pemeriksaan proses dan kesiapan API.
  - name: Account
    description: Identitas akun dan principal sesi aktif.
  - name: Employees
    description: Data profil pegawai; grant dan gap cakupan aktual dijelaskan per operasi.
  - name: Organizations
    description: Pohon organisasi bertipe unit, fakultas, jurusan, biro, dan bagian.
  - name: Attendance
    description: Penyimpanan fakta tap ternormalisasi; adapter vendor dan autentikasi perangkat belum tersedia.
  - name: Audit
    description: Jejak perubahan data sensitif; isi profil tidak pernah disalin ke log.
  - name: Categories
    description: Kategori pegawai aktif yang dapat dirujuk profil.
  - name: Payroll
    description: Slip gaji, konfirmasi pembayaran, dan jadwal gajian per unit.
  - name: Holidays
    description: Kalender hari libur nasional Indonesia; diisi dari penyedia dan disimpan di tabel lokal.
  - name: Admin
    description: Ringkasan operasional internal untuk administrator (agregat saja, bukan metrik mentah).
paths:
  /health:
    get:
      tags:
        - System
      operationId: getHealth
      x-implementation-status: implemented
      summary: Liveness aplikasi
      responses:
        "200":
          description: Proses aplikasi hidup.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
        "405":
          $ref: "#/components/responses/MethodNotAllowed"
  /ready:
    get:
      tags:
        - System
      operationId: getReadiness
      x-implementation-status: implemented
      summary: Readiness aplikasi
      description: >-
        Memeriksa dependency wajib sebelum API menerima traffic. Berbeda dengan liveness, endpoint ini gagal dengan 503
        bila dependency tidak siap. Detail kegagalan tidak dikembalikan agar tidak membocorkan host, connection string,
        atau kredensial.
      responses:
        "200":
          description: Aplikasi siap menerima traffic.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReadinessStatus"
        "405":
          $ref: "#/components/responses/MethodNotAllowed"
        "503":
          description: Aplikasi belum siap menerima traffic.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/v1/me:
    get:
      tags:
        - Account
      operationId: getCurrentAccount
      x-implementation-status: implemented
      summary: Membaca identitas pengguna dari sesi aktif
      description: >-
        Mengembalikan identitas, role, unit penugasan, dan daftar permission milik role. Permission berasal dari matriks
        akses pada server sehingga frontend tidak perlu menduplikasi aturan otorisasi.
      security:
        - bearerSession: []
      responses:
        "200":
          description: Identitas, cakupan dasar, dan permission principal terautentikasi.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CurrentAccount"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          description: Record profil tidak dapat dimuat dari database.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
    patch:
      tags:
        - Account
      operationId: updateCurrentAccountProfile
      x-implementation-status: implemented
      summary: Memperbarui profil mandiri pengguna dari sesi aktif
      description: >-
        Mengubah nama dan/atau nomor HP milik principal yang sedang masuk. Principal hanya dapat mengubah profilnya
        sendiri; identifier record selalu berasal dari sesi terverifikasi, bukan dari body permintaan. Perubahan dan
        jejak audit (`profile.updated`) disimpan dalam satu transaksi; jejak tidak memuat nilai, hanya nama kolom yang
        berubah. Perubahan lain (email, NIP, PII terenkripsi, role, unit) tidak dapat dilakukan lewat endpoint ini.
      security:
        - bearerSession: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateProfileRequest"
      responses:
        "200":
          description: Profil tersimpan; respons memuat keadaan kanonik setelah normalisasi.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CurrentAccount"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationError"
        "500":
          description: Profil tidak dapat disimpan.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/v1/auth/logout:
    post:
      tags:
        - Account
      operationId: logoutCurrentSession
      x-implementation-status: implemented
      summary: Mencabut sesi aktif
      description: >-
        Menghapus baris sesi pada tabel session sehingga token tidak lagi berlaku pada permintaan berikutnya. Operations
        idempoten: sesi yang sudah tidak ada tetap mengembalikan 204. Endpoint ini hanya mencabut sesi opaque di
        database; penrevokasian token JWT Better Auth harus dilakukan oleh runtime autentikasi.
      security:
        - bearerSession: []
      responses:
        "204":
          description: Sesi dicabut atau sudah tidak berlaku.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "405":
          $ref: "#/components/responses/MethodNotAllowed"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /api/v1/attendance/events:
    post:
      tags:
        - Attendance
      operationId: ingestAttendanceEvent
      x-implementation-status: implemented-deny-by-default
      x-required-permission: attendance:event:ingest
      summary: Menyimpan satu fakta tap mesin
      description: >-
        Endpoint aplikasi untuk adapter tepercaya, bukan protokol langsung ke Fingerspot. Memerlukan sesi API sementara
        dan permission eksplisit; grant saat ini hanya diberikan kepada admin dan bukan autentikasi perangkat. Retry
        dengan machineId dan idempotencyKey yang sama serta fakta tap identik mengembalikan eventId yang sama dan
        duplicate=true. Key yang sama dengan PIN atau waktu berbeda menghasilkan 409. occurredAt harus RFC 3339 dengan
        offset eksplisit; waktu dinormalisasi ke UTC dengan presisi milidetik sebelum disimpan. machinePin adalah kunci
        pemetaan eksternal, bukan relasi ke User/NIP. Tidak menerima payload vendor, biometrik, GPS, foto, atau status
        harian.
      security:
        - bearerSession: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AttendanceEventIngestRequest"
      responses:
        "200":
          description: Retry identik; event yang sudah tersimpan dikembalikan.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AttendanceEventIngestResponse"
        "201":
          description: Fakta tap baru tersimpan.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AttendanceEventIngestResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: Mesin yang dirujuk tidak terdaftar.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Idempotency key sudah digunakan untuk fakta tap berbeda.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          $ref: "#/components/responses/ValidationError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /api/v1/attendance/my-records:
    get:
      tags:
        - Attendance
      operationId: listMyAttendanceRecords
      x-implementation-status: implemented-deny-by-default
      x-required-permission: attendance:read:self
      summary: Membaca riwayat presensi sendiri
      description: >-
        Membaca record harian yang sudah tersimpan pada tabel Presensi. Endpoint ini tidak menghitung status dari
        AttendanceEvent. Rentang tanggal wajib, inklusif, maksimum 366 hari, dan mengikuti kalender operasional
        Asia/Jakarta.
      security:
        - bearerSession: []
      parameters:
        - name: from
          in: query
          required: true
          schema:
            type: string
            format: date
        - name: to
          in: query
          required: true
          schema:
            type: string
            format: date
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
      responses:
        "200":
          description: Halaman record presensi principal.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AttendanceRecordsResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          $ref: "#/components/responses/ValidationError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /api/v1/attendance/unit-records:
    get:
      tags:
        - Attendance
      operationId: listUnitAttendanceRecords
      x-implementation-status: implemented-deny-by-default
      x-required-permission: attendance:read:any|attendance:read:homebase
      summary: Membaca kehadiran tim per pegawai untuk satu tanggal
      description: >-
        Menampilkan seluruh pegawai aktif dalam cakupan pemohon untuk satu tanggal (LEFT JOIN ke tabel Presensi).
        Pegawai tanpa catatan pada tanggal itu tampil dengan `status` null, artinya belum tercatat — bukan alpa; aturan
        penurunan status harian belum disetujui. Admin mendapat cakupan global; operator dan atasan hanya mendapat unit
        penugasan beserta turunannya. `note` (keterangan presensi) dapat terlihat sesuai keputusan produk 13 November
        2026 (DEC-051). Data AttendanceEvent mentah tidak digunakan.
      security:
        - bearerSession: []
      parameters:
        - name: date
          in: query
          required: true
          schema:
            type: string
            format: date
      responses:
        "200":
          description: Seluruh pegawai aktif dalam cakupan beserta catatan presensinya (bisa kosong).
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/UnitDayRecord"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          $ref: "#/components/responses/ValidationError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /api/v1/attendance/unit-summary:
    get:
      tags:
        - Attendance
      operationId: getUnitAttendanceSummary
      x-implementation-status: implemented-deny-by-default
      x-required-permission: attendance:read:any|attendance:read:homebase
      summary: Membaca rekap presensi unit per hari
      description: >-
        Menghitung jumlah record Presensi per status dan tanggal. Admin mendapat cakupan global; operator dan atasan
        hanya mendapat unit penugasan beserta turunannya. Hari tanpa record tidak diimputasi sebagai absen. Data
        AttendanceEvent mentah tidak digunakan.
      security:
        - bearerSession: []
      parameters:
        - name: from
          in: query
          required: true
          schema:
            type: string
            format: date
        - name: to
          in: query
          required: true
          schema:
            type: string
            format: date
      responses:
        "200":
          description: Rekap harian dalam cakupan pemohon.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AttendanceDailySummary"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          $ref: "#/components/responses/ValidationError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /api/v1/employees:
    get:
      tags:
        - Employees
      operationId: listEmployees
      x-implementation-status: implemented-deny-by-default
      summary: Membaca daftar pegawai dengan pencarian dan filter
      description: >-
        Membutuhkan salah satu dari employee:read:any (admin, seluruh organisasi), employee:read:homebase (operator dan
        atasan, unit penugasan beserta turunannya), atau employee:read:self (pegawai, hanya record sendiri). Handler
        mempersempit hasil sesuai cakupan; filter homebaseId pada query adalah filter pilihan, bukan kontrol akses.
      security:
        - bearerSession: []
      parameters:
        - $ref: "#/components/parameters/Search"
        - $ref: "#/components/parameters/HomebaseFilter"
        - $ref: "#/components/parameters/Sort"
        - $ref: "#/components/parameters/Order"
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
      responses:
        "200":
          description: Halaman pegawai dalam cakupan pemohon.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EmployeePage"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
      x-required-permission: employee:read:any|employee:read:homebase|employee:read:self
    post:
      tags:
        - Employees
      operationId: createEmployee
      x-implementation-status: implemented-deny-by-default
      summary: Membuat profil pegawai
      description: >-
        Membutuhkan employee:create (admin, seluruh organisasi) atau employee:create:homebase (operator, unit penugasan
        beserta turunannya). Pembuatan profil belum otomatis membuat sesi, menetapkan role, atau mengirim undangan.
        Kebijakan provisioning harus diputuskan sebelum endpoint dibuka kepada pengguna.
      security:
        - bearerSession: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EmployeeCreate"
      responses:
        "201":
          description: Profil pegawai berhasil dibuat.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Employee"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          description: Email atau NIP sudah digunakan.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          $ref: "#/components/responses/ValidationError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
      x-required-permission: employee:create|employee:create:homebase
  /api/v1/employees/summary:
    get:
      tags:
        - Employees
      operationId: summaryEmployees
      x-implementation-status: implemented-deny-by-default
      x-required-permission: employee:read:any|employee:read:homebase|employee:read:self
      summary: Ringkasan jumlah pegawai dalam cakupan pemohon
      description: >-
        Mengembalikan total, jumlah aktif/nonaktif, dan jumlah per unit untuk seluruh pegawai dalam cakupan pemohon
        (employee:read:any: seluruh organisasi; employee:read:homebase: unit penugasan beserta turunannya;
        employee:read:self: hanya record sendiri). Populasinya identik dengan daftar pegawai, termasuk baris nonaktif;
        pegawai tanpa unit dikelompokkan dengan unitId null. Definisi ringkasan berada di DEC-055; perubahan definisi
        memerlukan keputusan pemilik produk.
      security:
        - bearerSession: []
      responses:
        "200":
          description: Ringkasan pegawai dalam cakupan pemohon.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EmployeeSummary"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /api/v1/employees/{employeeId}:
    parameters:
      - $ref: "#/components/parameters/EmployeeId"
    get:
      tags:
        - Employees
      operationId: getEmployee
      x-implementation-status: implemented-deny-by-default
      summary: Membaca profil pegawai
      description: >-
        Membutuhkan salah satu dari employee:read:any (admin, seluruh organisasi), employee:read:homebase (operator dan
        atasan, unit penugasan beserta turunannya), atau employee:read:self (pegawai, hanya record sendiri). Endpoint
        menerapkan pembatasan cakupan: operator dan atasan hanya membaca pegawai di unit penugasan beserta anak-anaknya,
        pegawai hanya membaca recordnya sendiri; akses di luar cakupan menghasilkan 403.
      security:
        - bearerSession: []
      responses:
        "200":
          description: Profil pegawai.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Employee"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
      x-required-permission: employee:read:any|employee:read:homebase|employee:read:self
    patch:
      tags:
        - Employees
      operationId: updateEmployee
      x-implementation-status: implemented-deny-by-default
      summary: Memperbarui field profil yang diizinkan
      description: >-
        Membutuhkan employee:update:any (admin, seluruh organisasi) atau employee:update:homebase (operator, unit
        penugasan beserta turunannya). Pegawai di luar cakupan menghasilkan 403. Role, status akun, userId, dan email
        login tidak dapat diubah melalui endpoint ini.
      security:
        - bearerSession: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EmployeeUpdate"
      responses:
        "200":
          description: Profil setelah perubahan.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Employee"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: NIP sudah digunakan oleh pegawai lain.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          $ref: "#/components/responses/ValidationError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
      x-required-permission: employee:update:any|employee:update:homebase
    delete:
      tags:
        - Employees
      operationId: archiveEmployee
      x-implementation-status: implemented-deny-by-default
      summary: Mengarsipkan pegawai
      description: Membutuhkan employee:archive. Sesi pengguna langsung ditolak setelah akun diarsipkan.
      security:
        - bearerSession: []
      responses:
        "204":
          description: Pegawai diarsipkan tanpa menghapus riwayat.
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
      x-required-permission: employee:archive|employee:archive:homebase
  /api/v1/employees/{employeeId}/role:
    parameters:
      - $ref: "#/components/parameters/EmployeeId"
    put:
      tags:
        - Employees
      operationId: assignEmployeeRole
      x-implementation-status: implemented-deny-by-default
      x-required-permission: employee:role:manage
      summary: Menetapkan role pegawai
      description: >-
        Hanya admin yang dapat menetapkan role admin, operator, atasan, atau pegawai. Perubahan user.roleId dan jejak
        employee.role.updated ditulis dalam satu transaksi; role berlaku pada permintaan berikutnya.
      security:
        - bearerSession: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EmployeeRoleAssignmentRequest"
      responses:
        "200":
          description: Role pegawai setelah perubahan.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EmployeeRoleAssignment"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /api/v1/employees/import-template.csv:
    get:
      tags:
        - Employees
      operationId: getEmployeeImportTemplate
      x-implementation-status: implemented-deny-by-default
      x-required-permission: employee:import|employee:import:homebase
      summary: Mengunduh template impor pegawai
      description: >-
        Membutuhkan employee:import. Template CSV menetapkan kolom nama, email, nip, jabatanStruktural,
        jabatanFungsional dalam urutan tersebut. Permission employee:import diberikan kepada admin; operator memakai
        employee:import:homebase, dan pegawai hasil impor ditempatkan pada unit penugasan operator karena template tidak
        memuat kolom unit. Role lain ditolak dengan 403.
      security:
        - bearerSession: []
      responses:
        "200":
          description: Template CSV dengan baris header saja.
          content:
            text/csv:
              schema:
                type: string
              example: "nama,email,nip,jabatanStruktural,jabatanFungsional\r\n"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "405":
          $ref: "#/components/responses/MethodNotAllowed"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /api/v1/employees/import:
    post:
      tags:
        - Employees
      operationId: importEmployees
      x-implementation-status: implemented-deny-by-default
      x-required-permission: employee:import|employee:import:homebase
      summary: Mengimpor pegawai secara massal
      description: >-
        Menerima satu berkas CSV, XLS, atau XLSX (maksimal 5 MiB dan 1000 baris data). Header harus tepat dan berurutan:
        nama,email,nip, jabatanStruktural,jabatanFungsional. nama dan email wajib; kolom lainnya opsional. Operasi
        create-only: seluruh berkas divalidasi sebelum ditulis, konflik email/NIP dan formula ditolak, lalu seluruh
        baris disimpan secara atomik. Tidak menerima role, assignment akses, NIK, payroll, bank, keluarga, atau field
        pajak. Excel harus satu sheet terlihat dan tanpa formula/makro. Permission employee:import diberikan kepada
        admin; operator memakai employee:import:homebase dan pegawai hasil impor ditempatkan pada unit penugasan
