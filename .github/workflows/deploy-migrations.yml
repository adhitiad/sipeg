name: Deploy Database Migrations

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Target environment (staging atau production)"
        required: true
        default: "staging"
        type: choice
        options:
          - staging
          - production

permissions:
  contents: read

concurrency:
  group: migrations-${{ github.event.inputs.environment }}
  cancel-in-progress: true

jobs:
  deploy-migrations:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    environment: ${{ github.event.inputs.environment }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - name: Download dan verifikasi dependensi
        run: |
          go mod download
          go mod verify

      - name: Gagal cepat bila DATABASE_URL belum diisi
        run: |
          if [ -z "${DATABASE_URL}" ]; then
            echo "Secret DATABASE_URL belum diisi pada environment ${{ github.event.inputs.environment }}"
            exit 1
          fi
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

      - name: Cek format kode
        run: |
          files="$(gofmt -l .)"
          if [ -n "$files" ]; then
            echo "$files"
            exit 1
          fi

      - name: Uji keselarasan model GORM dengan skema migrasi
        run: go test ./internal/database/...

      - name: Status migrasi sebelum diterapkan
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: go run ./cmd/migrate status

      - name: Terapkan migrasi tertunda
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: go run ./cmd/migrate up

      - name: Status migrasi setelah diterapkan
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: go run ./cmd/migrate status
