# Konfigurasi tambahan broker RabbitMQ untuk SIMPEG.
#
# Berkas ini dipasang sebagai /etc/rabbitmq/conf.d/10-simpeg.conf oleh
# docker-compose.yml. Kredensial tidak ditulis di sini; pengguna bawaan
# dibuat melalui variabel RABBITMQ_DEFAULT_USER/RABBITMQ_DEFAULT_PASS pada
# compose, dan ganti keduanya sebelum dipakai di luar komputer lokal.

# Listener AMQP tetap pada porta bawaan; di compose hanya jaringan internal
# yang memakai porta 5672, porta host hanya dibuka untuk debugging.
listeners.tcp.default = 5672

# Log ringkas ke stdout agar terekam `docker logs rabbitmq`.
log.console.level = info
log.console = true

# Batas memori broker; deployment pilot memakai memori kecil sehingga
# broker berhenti menerima publikasi sebelum host kehabisan memori.
vm_memory_high_watermark.relative = 0.6

# Topologi (exchange simpeg.jobs, antrean simpeg.jobs, dan antrean
# dead-letter) dideklarasikan oleh kode backend saat startup, bukan lewat
# berkas definisi, agar nama tidak bisa menyimpang dari konstanta paket
# internal/mq.
