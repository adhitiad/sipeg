components:
  headers:
    APIVersion:
      description: Versi API yang dipakai pada respons.
      schema:
        type: string
        example: v1
  securitySchemes:
    bearerSession:
      type: http
      scheme: bearer
      bearerFormat: opaque session token
      description: >-
        Kontrak sementara yang saat ini digunakan backend. Belum ditetapkan apakah frontend akan memakai bearer token
        atau provider lain.
    qstashSignature:
      type: apiKey
      in: header
      name: Upstash-Signature
      description: >-
        Signature HS256 QStash atas raw body permintaan (callback legacy). Tidak memakai sesi bearer; subjek signature
        harus cocok dengan URL tujuan yang dikonfigurasi. **QStash tidak dipakai pada deployment mana pun (DEC-102)** —
        transport pekerjaan terjadwal adalah RabbitMQ self-hosted; skema ini hanya untuk kompatibilitas.
  parameters:
    Search:
      name: search
      in: query
      description: >-
        Tanpa membedakan kapital. Pada pegawai: substring pada nama, atau kesetaraan persis NIP (setelah normalisasi)
        karena NIP disimpan terenkripsi; pada keluarga: substring pada nama, atau kesetaraan persis NIK (setelah
        normalisasi) karena NIK disimpan terenkripsi; pada resource lain: substring pada kolom teks.
      schema:
        type: string
        maxLength: 100
    HomebaseFilter:
      name: homebaseId
      in: query
      schema:
        type: string
        format: uuid
    Page:
      name: page
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 10000
        default: 1
    PageSize:
      name: pageSize
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    EmployeeId:
      name: employeeId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ID:
      name: cutiId
      in: path
      required: true
      schema:
        type: string
        format: uuid
      description: ID pengajuan cuti.
    ArsipId:
      name: arsipId
      in: path
      required: true
      schema:
        type: string
        format: uuid
      description: ID entri arsip dokumen.
    UserID:
      name: userId
      in: query
      schema:
        type: string
        format: uuid
    Sort:
      name: sort
      in: query
      description: >-
        Kolom pengurutan. Nilai di luar allowlist resource ditolak dengan 400 invalid_query; kolom SQL ditentukan
        server, bukan dari input pengguna.
      schema:
        type: string
        enum:
          - nama
          - createdAt
          - updatedAt
          - name
          - jenis
          - aksi
          - kode
          - periode
          - tanggalGaji
    Order:
      name: order
      in: query
      schema:
        type: string
        enum:
          - asc
          - desc
        default: asc
    AuditAction:
      name: aksi
      in: query
      schema:
        type: string
        maxLength: 100
    PayrollId:
      name: payrollId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    UnitId:
      name: unitId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    HolidayYearQuery:
      name: year
      in: query
      description: Tahun kalender; kosong berarti tahun berjalan (Asia/Jakarta).
      schema:
        type: integer
        minimum: 2000
        maximum: 2100
    HolidayYearPath:
      name: year
      in: path
      required: true
      schema:
        type: integer
        minimum: 2000
        maximum: 2100
    PayrollPeriod:
      name: periode
      in: query
      description: Periode bulanan penggajian dalam bentuk "YYYY-MM".
      schema:
        type: string
        pattern: ^[0-9]{4}-[0-9]{2}$
    PayrollStatus:
      name: status
      in: query
      schema:
        type: string
        enum:
          - DRAF
          - TERBIT
          - TERBAYAR
  responses:
    BadRequest:
      description: Parameter atau format request tidak valid.
      headers:
        X-API-Version:
          $ref: "#/components/headers/APIVersion"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    UnprocessableEntity:
      description: Request tidak lolos validasi aturan bisnis (misalnya eviden cuti yang wajib belum disertakan).
      headers:
        X-API-Version:
          $ref: "#/components/headers/APIVersion"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Unauthorized:
      description: Sesi tidak ada, tidak valid, atau kedaluwarsa.
      headers:
        X-API-Version:
          $ref: "#/components/headers/APIVersion"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Forbidden:
      description: Principal tidak memiliki permission yang diperlukan.
      headers:
        X-API-Version:
          $ref: "#/components/headers/APIVersion"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    ServiceUnavailable:
      description: Resolver sesi tidak dapat memeriksa sesi karena dependency tidak tersedia.
      headers:
        X-API-Version:
          $ref: "#/components/headers/APIVersion"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    NotFound:
      description: Resource tidak ditemukan atau berada di luar cakupan akses.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Conflict:
      description: Resource bertentangan dengan data yang sudah ada.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    MethodNotAllowed:
      description: HTTP method tidak didukung untuk endpoint ini.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    ValidationError:
      description: Field request gagal validasi.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ValidationErrorResponse"
  schemas:
    HealthStatus:
      type: object
      required:
        - status
      properties:
        status:
          type: string
          enum:
            - ok
            - ready
    CurrentAccount:
      type: object
      required:
        - userId
        - email
        - permissions
      properties:
        userId:
          type: string
          format: uuid
        email:
          type: string
          format: email
        roleName:
          type: string
        homebaseId:
          type: string
          format: uuid
        permissions:
          type: array
          description: >-
            Permission milik role principal sesuai matriks akses pada server. Daftar kosong berarti role tidak memiliki
            grant apa pun.
          items:
            type: string
        nama:
          type: string
          description: Nama lengkap principal. Hanya dikembalikan bila layanan profil mandiri tersedia pada deployment.
        noHp:
          type: string
          description: >-
            Nomor HP principal. Dihilangkan bila belum diisi. Hanya dikembalikan bila layanan profil mandiri tersedia
            pada deployment.
    UpdateProfileRequest:
      type: object
      description: Minimal satu kolom harus dikirim. `noHp` berisi teks kosong untuk mengosongkan nomor HP tersimpan.
      properties:
        nama:
          type: string
          minLength: 1
          maxLength: 200
        noHp:
          type: string
          maxLength: 20
          description: >-
            Nomor Indonesia dengan awalan 0 atau 62 (opsional tanda +), diikuti 8 sampai 15 digit. Spasi, titik, dan
            tanda hubung diabaikan. Teks kosong mengosongkan nomor HP tersimpan.
      additionalProperties: false
    ReadinessStatus:
      type: object
      required:
        - status
        - checks
      properties:
        status:
          type: string
          enum:
            - ready
            - not_ready
        checks:
          type: object
          additionalProperties:
            type: object
            required:
              - status
            properties:
              status:
                type: string
                enum:
                  - ok
                  - unavailable
    AttendanceEventIngestRequest:
      type: object
      additionalProperties: false
      required:
        - machineId
        - machinePin
        - occurredAt
        - idempotencyKey
      properties:
        machineId:
          type: string
          format: uuid
          description: ID mesin yang sudah terdaftar pada MesinAbsensi.
        machinePin:
          type: string
