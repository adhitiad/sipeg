version: 2
updates:
  # Dependency backend Go. go.mod mengunci versi dan go.sum ikut diperbarui
  # oleh Dependabot.
  - package-ecosystem: gomod
    directory: /backend
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - backend
    groups:
      go-dependencies:
        patterns:
          - "*"
        update-types:
          - minor
          - patch

  # Action GitHub yang dipakai workflow CI.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    labels:
      - dependencies
      - ci

  # Frontend belum dibuat; blokir akan aktif otomatis setelah package.json
  # dan lockfile frontend tersedia.
  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
    labels:
      - dependencies
      - frontend
    open-pull-requests-limit: 5
